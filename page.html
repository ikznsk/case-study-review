<style>
:root{--paper:#F1F4F3;--card:#FFFFFF;--ink:#151F1E;--muted:#5C6B68;--rule:#D0D8D5;--signal:#AE3B27;--accent:#2C5D59}

*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.6;padding:24px}
.gate{width:100%;max-width:420px;background:var(--card);border:1px solid var(--rule);padding:32px 30px 28px}

p{margin:0 0 18px;color:var(--muted);font-size:15.5px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:0}

button{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:15px;padding:10px 16px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.msg{min-height:22px;margin:12px 0 0;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--signal)}
</style>

const ITER = 300000;
const KEY = 'cs-review-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(DATA.salt), iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.iv)}, key, b64(DATA.ct));
  const html = new TextDecoder().decode(plain);
  try { localStorage.setItem(KEY, pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), pw = document.getElementById('pw'), b = document.getElementById('b'), msg = document.getElementById('msg');
f.addEventListener('submit', async e => {
  e.preventDefault(); msg.textContent = ''; b.disabled = true;
  try { await open(pw.value.trim()); }
  catch (err) { msg.textContent = 'Пароль не подошёл.'; b.disabled = false; pw.select(); }
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { await open(saved); } catch (e) {} }
})();
</script>
